<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Grid</title>
    <style>
        .container{
            border:2px solid rgb(0, 0, 0);
            display: grid;
            grid-template-areas:"nav nav nav" "side article article" "footer footer footer";
           
        }

        .item{
            border: 2px solid red;
            height: 55px;
        }

        .item1{
           grid-area: nav;
        }
        .item2{
            grid-area: side;
        }
        .item3{
            grid-area: article;
        }
        .item4{
            grid-area: footer;
        }

        .item5{
            grid-area: nav;
        }
        

        /* so if you activate the grid and we see there is a number indexing in the grid so based on that number we place the item */

    </style>
</head>
<body>
    <div class="container">
        <div class="item item1">nav</div>
        <div class="item item2">side</div>
        <div class="item item3">article</div>
        <div class="item item4">footer</div>
        <div class="item item5">5</div>
    </div>
</body>
</html>
