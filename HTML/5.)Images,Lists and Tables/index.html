<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8>
        <meta name="viewport" content="width=device-width,initial-scale=1.0">
        <title>title of the page</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <!-- images -->
        <img src="image.png" alt="train" width="500" height="400">

        <!-- Tables -->
         <table>
            <!-- Header content -->
            <thead>
                <caption>Employee Details</caption>
                <tr>
                    <th>Name</th>
                    <th>Designation</th>
                    <th>Fav Languages</th>
                </tr
            </thead>

            <!-- Body content -->
            <tbody>
                 <tr>
                    <td>Harry</td>
                    <td>Programmer</td>
                    <td>Javascript</td>
                </tr>

                 <tr>
                    <td colspan="2">Sam</td>
                </tr>
            </tbody>

            <!-- Footer content -->
            <tfoot>
                 <tr>
                    <td colspan="2">Sam</td>
                    <td rowspan="2">Java</td>
                </tr>
            </tfoot>
         </table>

         <!-- Lists -->

         <!-- Unordered Lists  -->
         <ul type="square">
            <li>Harry</li>
            <li>Rohan</li>
            <li>Shubham</li>
         </ul>

         <!-- Ordered Lists -->
         <ol>
            <li>Harry</li>
            <li>Rohan</li>
            <li>Shubham</li>
         </ol>
    </body>
</html>
