<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Filters</title>
    <style>
        img{
            /* filter: blur(10px); */
        }

        .img1{
            filter: brightness(122%);
        }
        .img2{
            /* filter: invert(1); */
            filter: opacity(0.5);
        }
        .img3{
            /* filter: grayscale(200%); */
            filter: sepia(200%);
        }
    </style>
</head>
<body>
    <div class="container">
        <img class="img1" src="images.jpeg" alt="">
        <img src="shah-rukh-khan-2092-12-09-2017-02-10-43.avif" alt="" class="img2">
        <img src="images (1).jpeg" alt="" class="img3">
    </div>
</body>
</html>
